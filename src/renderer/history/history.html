<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'" />
    <title>历史记录</title>
    <link rel="stylesheet" href="../shared/tokens.css" />
    <link rel="stylesheet" href="../shared/window.css" />
    <link rel="stylesheet" href="history.css" />
  </head>
  <body>
    <header>
      <p class="brand"><img src="../../../assets/icon.svg" alt="" width="22" height="22" />SpeakMore</p>
      <h1>历史记录</h1>
      <p id="summary" class="summary"></p>
    </header>
    <main>
      <section id="usage" class="usage" aria-labelledby="usage-title" hidden>
        <h2 id="usage-title" class="visually-hidden">用量</h2>
        <table class="usage-table">
          <thead>
            <tr>
              <td></td>
              <th scope="col">花费</th>
              <th scope="col">token</th>
              <th scope="col">听写</th>
              <th scope="col">模型回话</th>
            </tr>
          </thead>
          <tbody id="usage-rows"></tbody>
        </table>
        <p id="usage-note" class="usage-note"></p>
      </section>
      <p id="empty" class="empty" hidden>还没有记录。按一下热键开始说话，再按一下结束。</p>
      <p id="load-error" class="empty problem" hidden></p>
      <ol id="list" class="list"></ol>
    </main>
    <template id="entry">
      <li class="entry">
        <div class="meta">
          <time></time>
          <span class="duration"></span>
          <span class="spent" hidden></span>
          <span class="failed" hidden>失败</span>
          <button type="button" class="button copy">复制</button>
        </div>
        <p class="text"></p>
      </li>
    </template>
    <script type="module" src="history.mjs"></script>
  </body>
</html>
