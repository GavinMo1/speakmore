<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'" />
    <title>SpeakMore</title>
    <link rel="stylesheet" href="../shared/tokens.css" />
    <link rel="stylesheet" href="../shared/window.css" />
    <link rel="stylesheet" href="../shared/setup.css" />
    <link rel="stylesheet" href="hub.css" />
  </head>
  <body>
    <!-- 图标：lucide（ISC 许可），线宽 2，跟着字的颜色走 -->
    <svg class="sprite" aria-hidden="true">
      <symbol id="i-home" viewBox="0 0 24 24">
        <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" />
        <path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
      </symbol>
      <symbol id="i-history" viewBox="0 0 24 24">
        <path d="M3 12a9 9 0 1 0 9-9a9.75 9.75 0 0 0-6.74 2.74L3 8" />
        <path d="M3 3v5h5m4-1v5l4 2" />
      </symbol>
      <symbol id="i-settings" viewBox="0 0 24 24">
        <path
          d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0a2.34 2.34 0 0 0 3.319 1.915a2.34 2.34 0 0 1 2.33 4.033a2.34 2.34 0 0 0 0 3.831a2.34 2.34 0 0 1-2.33 4.033a2.34 2.34 0 0 0-3.319 1.915a2.34 2.34 0 0 1-4.659 0a2.34 2.34 0 0 0-3.32-1.915a2.34 2.34 0 0 1-2.33-4.033a2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"
        />
        <circle cx="12" cy="12" r="3" />
      </symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24">
        <path d="M10 5H3m9 14H3M14 3v4m2 10v4m5-9h-9m9 7h-5m5-14h-7m-6 5v4m0-2H3" />
      </symbol>
      <symbol id="i-key" viewBox="0 0 24 24">
        <path
          d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"
        />
        <circle cx="16.5" cy="7.5" r=".5" />
      </symbol>
      <symbol id="i-shield" viewBox="0 0 24 24">
        <path
          d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"
        />
        <path d="m9 12l2 2l4-4" />
      </symbol>
      <symbol id="i-info" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" />
        <path d="M12 16v-4m0-4h.01" />
      </symbol>
      <symbol id="i-alert" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" />
        <path d="M12 8v4m0 4h.01" />
      </symbol>
      <symbol id="i-copy" viewBox="0 0 24 24">
        <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
        <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
      </symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12" /></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m15 18l-6-6l6-6" /></symbol>
    </svg>

    <div class="app">
      <aside class="sidebar">
        <p class="brand"><img src="../../../assets/icon.svg" alt="" width="22" height="22" />SpeakMore</p>
        <nav aria-label="页面">
          <ul class="nav">
            <li>
              <button type="button" class="nav-item" data-route="home">
                <svg class="icon" aria-hidden="true"><use href="#i-home" /></svg>首页
              </button>
            </li>
            <li>
              <button type="button" class="nav-item" data-route="history">
                <svg class="icon" aria-hidden="true"><use href="#i-history" /></svg>历史
              </button>
            </li>
          </ul>
        </nav>
        <div class="sidebar-foot">
          <button type="button" class="icon-button" id="open-settings" aria-label="设置" title="设置">
            <svg class="icon" aria-hidden="true"><use href="#i-settings" /></svg>
          </button>
          <button type="button" class="icon-button" id="open-about" aria-label="关于" title="关于">
            <svg class="icon" aria-hidden="true"><use href="#i-info" /></svg>
          </button>
        </div>
      </aside>

      <main class="content">
        <div class="banner" id="banner" role="status" hidden>
          <svg class="icon" aria-hidden="true"><use href="#i-alert" /></svg>
          <p class="banner-text" id="banner-text"></p>
          <button type="button" class="button" id="banner-action">去设置</button>
        </div>

        <!-- 首页：原版"洞察"那一列，加上我们的花费；右边一列是口述卡和版本 -->
        <section class="page" data-route="home" aria-labelledby="home-title">
          <h1 class="page-title" id="home-title">说话，别打字</h1>
          <div class="home">
            <div class="insights">
              <div class="card stats">
                <div class="stat">
                  <p class="stat-value" id="stat-words"></p>
                  <p class="stat-label">字数</p>
                </div>
                <div class="stat">
                  <p class="stat-value" id="stat-saved"></p>
                  <p class="stat-label">省时</p>
                </div>
                <div class="stat">
                  <p class="stat-value" id="stat-speed"></p>
                  <p class="stat-label">语速</p>
                </div>
                <div class="stat">
                  <p class="stat-value" id="stat-time"></p>
                  <p class="stat-label">口述时长</p>
                </div>
              </div>

              <div class="card activity">
                <div class="streaks">
                  <div>
                    <p class="stat-value" id="stat-active"></p>
                    <p class="stat-label">活跃</p>
                  </div>
                  <div>
                    <p class="stat-value" id="stat-current"></p>
                    <p class="stat-label">连续</p>
                  </div>
                  <div>
                    <p class="stat-value" id="stat-longest"></p>
                    <p class="stat-label">最长连续</p>
                  </div>
                </div>
                <div class="heatmap" id="heatmap">
                  <div class="weekdays" aria-hidden="true">
                    <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
                  </div>
                  <div class="cells" id="heatmap-cells" role="img" aria-label="每天的口述次数"></div>
                  <button type="button" class="page-arrow" id="heatmap-back" aria-label="往前">
                    <svg class="icon" aria-hidden="true"><use href="#i-chevron" /></svg>
                  </button>
                  <div class="months" id="heatmap-months" aria-hidden="true"></div>
                  <button type="button" class="page-arrow next" id="heatmap-next" aria-label="往后">
                    <svg class="icon" aria-hidden="true"><use href="#i-chevron" /></svg>
                  </button>
                </div>
                <p class="legend" aria-hidden="true">
                  少<span class="cell" data-level="1"></span><span class="cell" data-level="2"></span
                  ><span class="cell" data-level="3"></span><span class="cell" data-level="4"></span>多
                </p>
              </div>

              <div class="card spend" id="spend" hidden>
                <div class="spend-head">
                  <p class="stat-value" id="spend-month"></p>
                  <p class="stat-label">本月花费</p>
                </div>
                <table class="spend-table">
                  <thead>
                    <tr>
                      <td></td>
                      <th scope="col">花费</th>
                      <th scope="col">token</th>
                      <th scope="col">次数</th>
                      <th scope="col">耗时</th>
                    </tr>
                  </thead>
                  <tbody id="spend-rows"></tbody>
                </table>
                <p class="spend-note" id="spend-note" hidden></p>
              </div>
            </div>

            <aside class="home-side">
              <!-- 口述卡：一张小卡，主题渐变只在键帽上 -->
              <div class="dictate">
                <kbd class="dictate-key" id="home-keycap"></kbd>
                <p class="dictate-title">按一下说话</p>
              </div>
              <p class="version" id="home-version"></p>
            </aside>
          </div>
        </section>

        <!-- 历史记录：按天分组，一行一条 -->
        <section class="page" data-route="history" aria-labelledby="history-title" hidden>
          <h1 class="page-title" id="history-title">历史</h1>
          <p class="problem load-error" id="history-error" role="alert" hidden></p>
          <p class="empty-state" id="history-empty" hidden></p>
          <div id="history-days"></div>
        </section>
      </main>
    </div>

    <template id="history-day">
      <section class="day">
        <h2 class="day-title">今天</h2>
        <ol class="rows"></ol>
      </section>
    </template>
    <template id="history-row">
      <li class="row">
        <time class="row-time"></time>
        <p class="row-text"></p>
        <div class="row-actions">
          <button type="button" class="icon-button copy" aria-label="复制" title="复制">
            <svg class="icon" aria-hidden="true"><use href="#i-copy" /></svg>
          </button>
          <button type="button" class="icon-button details">
            <svg class="icon" aria-hidden="true"><use href="#i-info" /></svg>
          </button>
        </div>
      </li>
    </template>

    <!-- 设置：原版的"设置中心"是盖在主窗口上的对话框，左边一列菜单 -->
    <dialog class="settings" id="settings" aria-labelledby="settings-heading">
      <h2 class="visually-hidden" id="settings-heading">设置</h2>
      <nav class="settings-menu" aria-label="设置分类">
        <button type="button" class="menu-item" data-pane="general">
          <svg class="icon" aria-hidden="true"><use href="#i-sliders" /></svg>通用
        </button>
        <button type="button" class="menu-item" data-pane="model">
          <svg class="icon" aria-hidden="true"><use href="#i-key" /></svg>模型<span class="menu-dot" data-for="model" hidden></span>
        </button>
        <button type="button" class="menu-item" data-pane="permissions">
          <svg class="icon" aria-hidden="true"><use href="#i-shield" /></svg>权限<span class="menu-dot" data-for="permissions" hidden></span>
        </button>
        <button type="button" class="menu-item" data-pane="about">
          <svg class="icon" aria-hidden="true"><use href="#i-info" /></svg>关于
        </button>
      </nav>
      <div class="settings-body">
        <button type="button" class="icon-button settings-close" id="settings-close" aria-label="关闭">
          <svg class="icon" aria-hidden="true"><use href="#i-close" /></svg>
        </button>

        <section class="pane" data-pane="general">
          <h3 class="pane-title">通用</h3>
          <div class="setting">
            <label class="setting-title" for="hotkey">快捷键</label>
            <select class="select" id="hotkey"></select>
          </div>
          <p class="setting-note" id="hotkey-note" role="status" hidden></p>
          <div class="setting">
            <label class="setting-title" for="theme">主题</label>
            <select class="select" id="theme"></select>
          </div>
          <p class="setting-note" id="theme-note" role="status" hidden></p>
          <!-- 从终端启动时登记不了开机启动，整行不显示 -->
          <div class="setting" id="open-at-login-row">
            <label class="setting-title" for="open-at-login">开机启动</label>
            <input type="checkbox" class="switch" id="open-at-login" />
          </div>
          <p class="setting-note" id="general-problem" role="alert" hidden></p>
        </section>

        <section class="pane" data-pane="model" hidden>
          <h3 class="pane-title">模型</h3>
          <div class="key-panel" id="key-panel"></div>
        </section>

        <section class="pane" data-pane="permissions" hidden>
          <h3 class="pane-title">权限</h3>
          <ul class="permissions">
            <li data-permission="microphone">
              <p class="setting-title">麦克风</p>
              <span class="granted"></span>
              <button type="button" class="button">系统设置</button>
            </li>
            <li data-permission="listen">
              <p class="setting-title">输入监控</p>
              <span class="granted"></span>
              <button type="button" class="button">系统设置</button>
            </li>
            <li data-permission="trusted">
              <p class="setting-title">辅助功能</p>
              <span class="granted"></span>
              <button type="button" class="button">系统设置</button>
            </li>
          </ul>
          <p class="recheck-row"><button type="button" class="button" id="recheck">重新检查</button></p>
        </section>

        <section class="pane" data-pane="about" hidden>
          <h3 class="pane-title">关于</h3>
          <div class="setting">
            <p class="setting-title">版本</p>
            <p class="setting-value" id="about-version"></p>
          </div>
          <div class="setting">
            <p class="setting-title">数据目录</p>
            <code class="setting-value" id="about-home"></code>
          </div>
          <div class="setting">
            <p class="setting-title">源代码</p>
            <button type="button" class="button" id="open-homepage">GitHub</button>
          </div>
        </section>
      </div>
    </dialog>

    <script type="module" src="hub.mjs"></script>
  </body>
</html>
