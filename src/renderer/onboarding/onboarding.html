<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'" />
    <title>SpeakMore</title>
    <link rel="stylesheet" href="../shared/tokens.css" />
    <link rel="stylesheet" href="../shared/window.css" />
    <link rel="stylesheet" href="../shared/setup.css" />
    <link rel="stylesheet" href="onboarding.css" />
  </head>
  <body>
    <!-- 首次引导：对应原版的 onboarding.html。原版分"注册 · 设置 · 体验一下"三段，
         我们没有账号，第一段换成接上一家模型 -->
    <header class="steps">
      <ol class="step-groups">
        <li data-group="key">模型</li>
        <li data-group="setup">设置</li>
        <li data-group="try">试一下</li>
      </ol>
    </header>

    <main class="stage">
      <section class="step" data-step="key" aria-labelledby="key-title">
        <div class="step-text">
          <h1 class="step-title" id="key-title"><span class="soft">先接上</span>模型</h1>
          <div class="key-panel" id="key-panel"></div>
        </div>
        <aside class="visual flow" aria-hidden="true">
          <p class="flow-card">“嗯，我们明天九点开会，不对，九点半……”</p>
          <p class="flow-arrow">↓</p>
          <p class="flow-card model" id="flow-model">Gemini</p>
          <p class="flow-arrow">↓</p>
          <p class="flow-card result">我们明天九点半开会。</p>
        </aside>
      </section>

      <section class="step" data-step="permissions" aria-labelledby="permissions-title" hidden>
        <div class="step-text">
          <h1 class="step-title" id="permissions-title"><span class="soft">开三项</span>权限</h1>
          <ul class="grants">
            <li data-permission="microphone">
              <p class="grant-primary">麦克风</p>
              <button type="button" class="button primary">允许</button>
            </li>
            <li data-permission="listen">
              <p class="grant-primary">输入监控</p>
              <button type="button" class="button primary">允许</button>
            </li>
            <li data-permission="trusted">
              <p class="grant-primary">辅助功能</p>
              <button type="button" class="button primary">允许</button>
            </li>
          </ul>
        </div>
        <aside class="visual privacy">
          <p class="privacy-name">历史只存本机</p>
          <p class="privacy-name">录音只发所选模型</p>
          <p class="privacy-name">key 加密存本机</p>
        </aside>
      </section>

      <section class="step" data-step="microphone" aria-labelledby="microphone-title" hidden>
        <div class="step-text">
          <h1 class="step-title" id="microphone-title"><span class="soft">说句话，</span>测麦克风</h1>
          <p class="question">条在动吗？</p>
          <div class="answers">
            <button type="button" class="button primary" id="microphone-yes">在动，继续</button>
            <button type="button" class="button" id="microphone-no">不动</button>
          </div>
          <p class="hint" id="microphone-help" hidden>
            查 系统设置 › 声音 › 输入：设备、音量 · 或麦克风权限没开
            <button type="button" class="link" id="microphone-settings">麦克风权限</button>
          </p>
          <p class="problem" id="microphone-error" role="alert" hidden></p>
        </div>
        <aside class="visual meter-panel" aria-hidden="true">
          <div class="meter" id="meter"></div>
        </aside>
      </section>

      <section class="step" data-step="hotkey" aria-labelledby="hotkey-title" hidden>
        <div class="step-text">
          <h1 class="step-title" id="hotkey-title"><span class="soft">按一下，</span>测快捷键</h1>
          <p class="question">键变色了吗？</p>
          <div class="answers">
            <button type="button" class="button primary" id="hotkey-yes">变了，继续</button>
            <button type="button" class="button" id="hotkey-no">没变，换个键</button>
          </div>
          <div class="hotkey-choice" id="hotkey-choice" hidden>
            <label for="hotkey-select">换成</label>
            <select class="select" id="hotkey-select"></select>
          </div>
          <p class="hint" id="hotkey-note" role="status" hidden></p>
        </div>
        <aside class="visual keycap-panel" aria-hidden="true">
          <kbd class="big-keycap" id="big-keycap"></kbd>
        </aside>
      </section>

      <section class="step" data-step="try" aria-labelledby="try-title" hidden>
        <div class="step-text">
          <h1 class="step-title" id="try-title"><span class="soft">现在，</span>说一句</h1>
          <blockquote class="sample">嗯，我们明天上午九点开会，不对，九点半吧，记得把上周的数据带上。</blockquote>
        </div>
        <aside class="visual notes">
          <textarea class="notes-text" id="try-text" aria-label="笔记"></textarea>
        </aside>
      </section>

      <section class="step done" data-step="done" aria-labelledby="done-title" hidden>
        <h1 class="step-title" id="done-title"><span class="soft">说话，</span>别打字</h1>
        <button type="button" class="button primary big" id="finish">开始使用</button>
      </section>
    </main>

    <footer class="nav">
      <button type="button" class="button" id="back">返回</button>
      <button type="button" class="button primary" id="next">继续</button>
    </footer>

    <script type="module" src="onboarding.mjs"></script>
  </body>
</html>
