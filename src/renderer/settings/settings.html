<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'" />
    <title>听写设置</title>
    <link rel="stylesheet" href="../shared/tokens.css" />
    <link rel="stylesheet" href="../shared/window.css" />
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <header>
      <p class="brand"><img src="../../../assets/icon.svg" alt="" width="22" height="22" />SpeakMore</p>
      <h1>听写设置</h1>
    </header>
    <main>
      <section class="status" id="status" data-state="pending" aria-live="polite">
        <p class="status-title" id="status-title"></p>
        <p class="status-detail" id="status-detail"></p>
        <p class="status-detail" id="status-degraded" hidden></p>
      </section>

      <section aria-labelledby="key-heading">
        <h2 id="key-heading">用哪家的模型</h2>
        <div class="providers" id="providers" role="radiogroup" aria-labelledby="key-heading"></div>
        <div class="key-state-row">
          <p class="state" id="key-state"></p>
          <button type="button" class="button primary" id="use-provider" hidden>改用</button>
        </div>
        <form class="key-form" id="key-form">
          <input
            type="password"
            id="key-input"
            autocomplete="off"
            spellcheck="false"
            placeholder="把 key 粘贴到这里"
            aria-label="API key"
          />
          <button type="button" class="button" id="paste-key">从剪贴板粘贴</button>
          <button type="submit" class="button primary" id="save-key">保存并验证</button>
        </form>
        <p class="problem" id="key-problem" role="alert" hidden></p>
        <p class="hint" id="key-note" hidden></p>
        <p class="hint">
          选哪家，录音就发给哪家整理成文字，所以要一把你自己的 key。它用系统钥匙串加密后存在这台电脑上，不会显示出来，也不会发到别处。
        </p>
        <p class="links">
          <button type="button" class="link" id="open-key-page">去 Google AI Studio 申请一把</button>
          <button type="button" class="link" id="forget-key" hidden>删除已保存的 key</button>
        </p>
      </section>

      <section aria-labelledby="permissions-heading">
        <h2 id="permissions-heading">系统权限</h2>
        <ul class="permissions">
          <li data-permission="microphone">
            <div class="what"><strong>麦克风</strong><span>录下你说的话</span></div>
            <span class="granted"></span>
            <button type="button" class="button">打开系统设置</button>
          </li>
          <li data-permission="listen">
            <div class="what"><strong>输入监控</strong><span>听到你按热键。只认这一个键，别的按键不记录</span></div>
            <span class="granted"></span>
            <button type="button" class="button">打开系统设置</button>
          </li>
          <li data-permission="trusted">
            <div class="what">
              <strong>辅助功能</strong>
              <span>把文字贴进输入框；说话时按 esc 取消、点悬浮条上的按钮也靠它。没有它时文字放进剪贴板，要自己按 ⌘V</span>
            </div>
            <span class="granted"></span>
            <button type="button" class="button">打开系统设置</button>
          </li>
        </ul>
        <p class="hint">
          在系统设置里把开关打开之后，回到这里点
          <button type="button" class="button" id="recheck">重新检查</button>
        </p>
      </section>

      <section aria-labelledby="startup-heading">
        <h2 id="startup-heading">启动</h2>
        <label class="check"><input type="checkbox" id="open-at-login" /> 登录这台电脑时自动启动</label>
        <p class="hint" id="open-at-login-hint" hidden>现在是从终端启动的，装成应用之后才能设置。</p>
      </section>

      <footer>
        <span>设置、历史和录音都在 <code id="data-dir"></code></span>
        <button type="button" class="link" id="show-history">看历史记录</button>
      </footer>
    </main>
    <script type="module" src="settings.mjs"></script>
  </body>
</html>
